name: QA

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Lint application and tests
        run: ruff check --select E4,E7,E9,F app tests migrations
      - name: Run tests with coverage
        run: coverage run --branch -m unittest discover -s tests -v && coverage report --include="app/*.py"
      - name: Compile Python sources
        run: python -m compileall -q app tests migrations scripts
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
      - name: Generate offline migration SQL
        run: alembic upgrade head --sql > /tmp/ingpce-migrations.sql